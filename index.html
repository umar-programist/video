<!doctype html>
<html lang="tg">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f5f7f4">
	<meta name="description" content="VIDA — ҷои кашф ва тамошои видеоҳои нав. Каналҳои дӯстдошта, мусиқӣ, омӯзиш ва фароғат.">
	<title>VIDA — видеоҳои дӯстдоштаатон</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css?v=20260928-3">
	<script src="js.js?v=20260928-3" defer></script>
</head>
<body>
	<header class="topbar">
		<a class="brand" href="#home" aria-label="VIDA — саҳифаи асосӣ"><span class="brand-mark"><span></span></span><span>vida<span class="brand-dot">.</span></span></a>
		<form class="search" id="searchForm" role="search">
			<label class="sr-only" for="searchInput">Ҷустуҷӯи видео ва каналҳо</label>
			<input id="searchInput" type="search" placeholder="Видео, канал ё мавзӯъро ҷустуҷӯ кунед" autocomplete="off">
			<button type="submit" aria-label="Ҷустуҷӯ"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg></button>
		</form>
		<div class="top-actions">
			<button class="icon-button theme-toggle" id="themeToggle" aria-label="Гузаштан ба режими шаб" aria-pressed="false" title="Режими шаб"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13A8.5 8.5 0 0 1 11 3.2 8.6 8.6 0 1 0 20.8 13Z"></path></svg></button>
			<button class="icon-button upload-button" id="uploadButton" title="Илова кардани видео" aria-label="Илова кардани видео"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></button>
			<button class="profile-button" id="profileButton" aria-label="Интихоби профил" aria-haspopup="dialog" aria-controls="profilesDialog" title="Интихоби профил"><span class="avatar" id="profileAvatar">М</span><span class="profile-name" id="profileName">Ман</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg></button>
		</div>
	</header>

	<nav class="library-nav" id="mainNav" aria-label="Китобхонаи ман"></nav>

	<main class="main-content" id="mainContent">
		<div id="pageView" aria-live="polite"></div>
	</main>

		<dialog class="app-dialog profile-dialog" id="profilesDialog" aria-labelledby="profilesTitle">
			<div class="dialog-panel">
				<div class="dialog-heading">
					<div><p class="eyebrow">КИТОБХОНАИ ҶУДОГОНА</p><h2 id="profilesTitle">Профилҳоро интихоб кунед</h2></div>
					<button class="dialog-close" type="button" data-close-dialog aria-label="Пӯшидан">×</button>
				</div>
				<div class="profile-list" id="profileList"></div>
				<form class="profile-create" id="createProfileForm">
					<label class="field-label" for="newProfileName">Профили нав</label>
					<div class="profile-create-row"><input class="profile-name-input" id="newProfileName" type="text" maxlength="32" placeholder="Номи шахс" required><button class="primary-button" type="submit">Сохтан</button></div>
				</form>
				<p class="profile-note">Номи профили шумо дар зери видеоҳоятон менамояд. Писандидаҳо ва таърих дар ҳамин дастгоҳ нигоҳ дошта мешаванд.</p>
			</div>
		</dialog>

	<dialog class="app-dialog upload-dialog" id="uploadDialog" aria-labelledby="uploadTitle">
		<form class="dialog-panel" id="uploadForm">
			<div class="dialog-heading">
				<div><p class="eyebrow">КИТОБХОНАИ ШАХСӢ</p><h2 id="uploadTitle">Видео илова кунед</h2></div>
				<button class="dialog-close" type="button" data-close-dialog aria-label="Пӯшидан">×</button>
			</div>
			<label class="field-label" for="uploadCategory">Мавзӯи видео</label>
			<select class="category-select" id="uploadCategory" required></select>
			<label class="dropzone" for="videoFiles">
				<span class="drop-icon">↑</span>
				<strong>Видеоҳои худро интихоб кунед</strong>
				<span id="uploadStatus">MP4, WebM ё MOV · як ё чанд файл (то 800 МБ)</span>
				<input id="videoFiles" type="file" accept="video/*" multiple>
			</label>
			<ul class="selected-files" id="selectedFiles" aria-live="polite"></ul>
			<div class="dialog-footer">
				<p>Видео ба сервер бор мешавад ва ҳама онро мебинанд.</p>
				<button class="primary-button" id="confirmUpload" type="submit" disabled>Илова ба китобхона</button>
			</div>
		</form>
	</dialog>

	<dialog class="app-dialog player-dialog" id="playerDialog" aria-labelledby="playerTitle">
		<div class="player-panel">
			<div class="player-heading"><div><p class="eyebrow">ВИДЕОИ ШУМО</p><h2 id="playerTitle"></h2></div><button class="dialog-close" type="button" data-close-dialog aria-label="Пӯшидан">×</button></div>
			<video id="videoPlayer" controls playsinline preload="metadata"></video>
			<p class="player-caption" id="playerCaption"></p>
			<button class="primary-button" id="deleteVideo" type="button" hidden>Нест кардани видео</button>
		</div>
	</dialog>

	<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
